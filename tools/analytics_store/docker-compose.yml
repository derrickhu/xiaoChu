services:
  mysql:
    image: mysql:8.4
    container_name: xiao_chu_analytics_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: xiaochu_local
      MYSQL_DATABASE: xiao_chu_analytics
      MYSQL_USER: xiaochu
      MYSQL_PASSWORD: xiaochu_local
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
